memory_limit = 512M
max_execution_time = 120
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.max_accelerated_files = 50000
opcache.validate_timestamps = 0
opcache.jit = off
error_log = /var/log/php-errors.log
log_errors = On
display_errors = Off
error_reporting = E_ALL
