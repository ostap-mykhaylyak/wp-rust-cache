[workspace]
resolver = "2"
members = ["rust-core", "php-extension/ffi", "tools/cli", "tools/bench"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/ostap-mykhaylyak/wp-rust-cache"
rust-version = "1.80"

[workspace.dependencies]
libc = "0.2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1
