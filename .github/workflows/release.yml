name: release

on:
  push:
    tags: ["v*"]
  # A change to the release itself is rehearsed on its pull request:
  # everything is built, nothing is published.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/**

permissions:
  contents: read

env:
  VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.0.0-rehearsal' }}

jobs:
  # A tag is released only if the tree it names passes the tests.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace -- --test-threads=1

  build:
    needs: test
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          grep -q "^version = \"${VERSION#v}\"" Cargo.toml \
            || { echo "Cargo.toml version is not ${VERSION#v}"; exit 1; }
      # Modules for PHP 8.2–8.5 and the CLI, built on Debian 12, then the .deb.
      - run: sh packaging/build-all.sh
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.runner }}
          path: dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      # Signed provenance: `gh attestation verify FILE --repo
      # ostap-mykhaylyak/wp-rust-cache` proves a file was built here, by
      # this workflow, from this tag.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.deb

      - name: release notes
        run: |
          # The CHANGELOG section of this version, heading excluded.
          awk -v v="## ${VERSION}" '
            index($0, v) == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for ${VERSION}"; exit 1; }

      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          files: |
            dist/*.deb
            dist/SHA256SUMS
